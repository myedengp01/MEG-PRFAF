name: Wire PRFAF dashboard navigation (feature only)
on:
  push:
    branches: [feature/universal-claims-v2026-09-17-1430]
    paths:
      - '.github/workflows/wire-universal-dashboard-navigation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    if: github.ref == 'refs/heads/feature/universal-claims-v2026-09-17-1430'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing navigation module and baseline
        run: |
          node --check src/universal-dashboard-navigation.js
          node --check scripts/wire-universal-dashboard-navigation.cjs
          test "$(git hash-object index.html)" = 602ddc07a5af468ba0021d00dd37d4c163da42ac
      - name: Wire exactly one navigation module
        run: node scripts/wire-universal-dashboard-navigation.cjs
      - name: Verify exact safe patch
        run: |
          git diff --check
          git diff -- index.html | grep -F '+<script src="./src/universal-dashboard-navigation.js"></script>'
          test "$(git diff --numstat -- index.html)" = "1	0	index.html"
      - name: Commit index only; never merge or deploy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'feat(prfaf): load Back to Dashboard navigation on feature branch'
          git push origin HEAD:feature/universal-claims-v2026-09-17-1430
